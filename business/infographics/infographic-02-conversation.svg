<text x="90" y="140" font-size="30" fill="#FFFFFF">POC 02 · CTO CONCLUSIONS</text>
<text x="90" y="265" font-size="47" font-weight="700" fill="#1A1A2E">Conversation Is a Coordination Primitive</text>
<text x="90" y="325" font-size="29" fill="#22303A">The transcript is the system of record</text>
<text x="90" y="366" font-size="24" letter-spacing="3" fill="#C9A227">KEY DATA POINTS · SCRIPTED DEMONSTRATION (ILLUSTRATIVE)</text>
<text x="90" y="452" font-size="72" font-weight="700" fill="#1B9AAA">12 messages</text><text x="90" y="494" font-size="27" fill="#22303A">the entire collaboration — nothing outside the transcript</text><text x="90" y="580" font-size="72" font-weight="700" fill="#1B9AAA">4 analysis tasks</text><text x="90" y="622" font-size="27" fill="#22303A">coordinated by two agents with no shared memory</text><text x="90" y="730" font-size="72" font-weight="700" fill="#1B9AAA">3 unasked-for findings</text><text x="90" y="772" font-size="27" fill="#22303A">incl. a $78 unused charge the analyst never queried</text><text x="90" y="880" font-size="72" font-weight="700" fill="#1B9AAA">100% replayable</text><text x="90" y="922" font-size="27" fill="#22303A">audit = read the transcript; there is nowhere else for state to hide</text>
<rect x="60" y="1040" width="1080" height="240" fill="#1A1A2E"/>
<text x="90" y="1100" font-size="26" letter-spacing="3" fill="#C9A227">THE CTO CONCLUSION</text>
<text x="90" y="1155" font-size="31" fill="#FFFFFF">If agent work cannot be replayed from one record,</text>
<text x="90" y="1200" font-size="31" fill="#FFFFFF">you do not have automation — you have anecdotes.</text>
<text x="90" y="1350" font-size="28" font-weight="600" fill="#1B9AAA">Run it as a measured pilot: one workflow, transcript-of-record on.</text>
