<text x="90" y="265" font-size="47" font-weight="700" fill="#1A1A2E">RODS — Contract Before Capability</text>
<text x="90" y="325" font-size="29" fill="#22303A">Four lines, linted before the agent runs</text>
<text x="90" y="366" font-size="24" letter-spacing="3" fill="#C9A227">KEY DATA POINTS · SCRIPTED DEMONSTRATION (ILLUSTRATIVE)</text>
<text x="90" y="452" font-size="72" font-weight="700" fill="#1B9AAA">4 lines</text><text x="90" y="494" font-size="27" fill="#22303A">Role · Output · Do-Nots · Signal — the whole contract</text><text x="90" y="580" font-size="72" font-weight="700" fill="#1B9AAA">3 flags</text><text x="90" y="622" font-size="27" fill="#22303A">on the bad contract: missing Do-Nots, vague output, weak signal</text><text x="90" y="730" font-size="72" font-weight="700" fill="#1B9AAA">0 flags</text><text x="90" y="772" font-size="27" fill="#22303A">on the good contract — it runs; the other never executes</text><text x="90" y="880" font-size="72" font-weight="700" fill="#1B9AAA">1 typed signal</text><text x="90" y="922" font-size="27" fill="#22303A">EXTRACTION COMPLETE ends the run — never a prose word</text>
<rect x="60" y="1040" width="1080" height="240" fill="#1A1A2E"/>
<text x="90" y="1100" font-size="26" letter-spacing="3" fill="#C9A227">THE CTO CONCLUSION</text>
<text x="90" y="1155" font-size="31" fill="#FFFFFF">Contract failures are preventable before runtime.</text>
<text x="90" y="1200" font-size="31" fill="#FFFFFF">Four lines and a checker price the risk before deployment.</text>
<text x="90" y="1350" font-size="28" font-weight="600" fill="#1B9AAA">Adopt it as the intake gate: no contract, no run.</text>
